plugins {
    id 'com.android.application'
}

def campusUrl = (project.findProperty('campusUrl') ?: '').toString().trim()

android {
    namespace 'app.campusos.android'
    compileSdk 35

    defaultConfig {
        applicationId 'app.campusos.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'CAMPUS_URL', "\"${campusUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
